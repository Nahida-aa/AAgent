[package]
name = "theme_settings"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "aacode Theme + UI settings struct + 主题系统初始化（对齐 Zed crates/theme_settings）"

[features]
default = []
test-support = ["gpui/test-support", "settings/test-support", "theme/test-support"]

[dependencies]
theme.workspace = true
collections.workspace = true
gpui.workspace = true
inventory.workspace = true
settings = { workspace = true }
settings_content.workspace = true
settings_macros.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
palette = { workspace = true, default-features = false, features = ["std"] }
# bundled_themes：把 JSON 内容 refine 进 ThemeColors / StatusColors
# （`Refineable::refine`，与 zed 同款）。
refineable.workspace = true
schemars.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
# 测试里用真实资产源装载内嵌的主题 JSON。
aa_gpui_kit_assets = { workspace = true }
