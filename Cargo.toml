[workspace]
resolver = "3"
members = [
    "packages/kernel",
    "packages/core",
    "packages/extension-sdk",
    "packages/extensions",
    "packages/function-tools",
    "packages/extension-mcp",
    "packages/llm",
    "packages/cli",
    "packages/server",
    "packages/config",
    "packages/session",
    "packages/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# 与 gpui_learn / aa-player 保持相同 GPUI 来源，方便经验复用。
gpui = { version = "0.2.2", default-features = false }
gpui_macros = { version = "0.1.0" }
gpui_platform = { version = "0.1.0" }
gpui_util = { version = "0.1.0" }

tokio = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["rt"] }
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["cors", "fs"] }
tower = { version = "0.5", features = ["util"] }
wasmtime = { version = "45", features = ["component-model", "wat"] }
anyhow = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
glob = "0.3"
tempfile = "3"

[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed", rev = "801c087af22dd189dc1aa49e2f370b4f04190b19", version = "=0.2.2" }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "801c087af22dd189dc1aa49e2f370b4f04190b19", version = "=0.1.0" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "801c087af22dd189dc1aa49e2f370b4f04190b19", version = "=0.1.0" }
gpui_wgpu = { git = "https://github.com/zed-industries/zed", rev = "801c087af22dd189dc1aa49e2f370b4f04190b19", version = "=0.1.0" }
gpui_util = { git = "https://github.com/zed-industries/zed", rev = "801c087af22dd189dc1aa49e2f370b4f04190b19", version = "=0.1.0" }