# 本地开发覆盖：把 aa_gpui_kit_theme 指向本机 clone（含 theme 修复 cba2f68），
# 其余 5 个 crate 仍走 GitHub 的 c712ba1（已推送，本机克隆里这几 crate 内容与 c712ba1 一致）。
# 仅开发期用；把 gpui_learn 的 cba2f68 推到 GitHub 后即可整段删除。
# zed git 源里的 crate 也会拖 zed 自己的 `language_core`，与我们的
# `packages/language_core` 形成两份 —— 于是 `LanguageConfig` / `LanguageQueries` /
# `LanguageName` 全都"类型不同"（E0308 + 「multiple different versions」）。
# 统一指到本地这份。
[patch."https://github.com/zed-industries/zed"]
language_core = { path = "packages/language_core" }

[patch."https://github.com/Nahida-aa/gpui_learn.git"]
aa_gpui_kit_theme = { path = "/home/aa/repos/ide_ls/gpui_learn/packages/theme" }
aa_gpui_kit_ui = { path = "/home/aa/repos/ide_ls/gpui_learn/packages/ui" }
# icons 是刚加进 gpui_learn 的新包，还没进上面 git 依赖锁定的那个 rev，
# 先用本地 path 顶上，等推上去并更新 rev 后可以移除这条。
aa_icons = { path = "/home/aa/repos/ide_ls/gpui_learn/packages/icons" }
# clock 补了 utc_now() 别名（让照搬的 zed 代码零改动），同样先走本地。
aa_clock = { path = "/home/aa/repos/ide_ls/gpui_learn/packages/clock" }
# aa_gpui_fuzzy 的路径类型从 std::path::Path 换成了 zed 的 `path::RelPath`，
# 与 zed crates/fuzzy_nucleo 对齐；project 因此不再需要手写 PathStyle 转换。
aa_gpui_fuzzy = { path = "/home/aa/repos/ide_ls/gpui_learn/packages/gpui_fuzzy" }
# ui / ui_input / component 必须同源：ui 走本地 path 后，若 ui_input 还留在 c712ba1，
# 两者会各拖一份 aa_gpui_kit_component，于是出现两个不同的 `Component` trait，
# 报 `InputField: Component is not satisfied`（E0277 + 「multiple different versions」）。
aa_gpui_kit_ui_input = { path = "/home/aa/repos/ide_ls/gpui_learn/packages/ui_input" }
aa_gpui_kit_component = { path = "/home/aa/repos/ide_ls/gpui_learn/packages/component" }
