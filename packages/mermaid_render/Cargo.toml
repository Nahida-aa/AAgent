[package]
name = "mermaid_render"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
anyhow.workspace = true
gpui.workspace = true
merman = { version = "=0.8.0-alpha.5", default-features = false, features = [
    "layout-cytoscape",
    "svg",
] }
# merman 全套 pin alpha.5，merman-core alpha.6 与 merman-render alpha.5 API 不兼容
merman-core = "=0.8.0-alpha.5"
quick-xml.workspace = true
serde_json.workspace = true
tracing.workspace = true
a_tracing.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
mermaid_render = { path = ".", features = ["test-support"] }
usvg.workspace = true

[package.metadata.cargo-shear]
ignored = ["tracing"]
