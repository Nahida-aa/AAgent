[workspace]
resolver = "3"
members = [
    "packages/kernel",
    "packages/core",
    "packages/extension-sdk",
    "packages/extensions",
    "packages/function-tools",
    "packages/extension-mcp",
    "packages/llm",
    "packages/cli",
    "packages/server",
    "packages/settings",
    "packages/session",
    "packages/app", "packages/ui", "packages/workspace", "packages/settings_content", "packages/sidebar", "packages/aagent_actions", "packages/terminal", "packages/terminal_view", "packages/task", "packages/theme_settings", "packages/settings_macros", "packages/title_bar", "packages/agent_ui", "packages/audio", "packages/util", "packages/project", "packages/worktree", "packages/fs", "packages/rope", "packages/text", "packages/breadcrumbs", "packages/language",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# 与 gpui_learn / aa-player 保持相同 GPUI 来源，方便经验复用。
gpui = { version = "0.2.2", default-features = false }
gpui_macros = { version = "0.1.0" }
gpui_platform = { version = "0.1.0" }
gpui_util = { version = "0.1.0" }

tokio = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["rt"] }
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["cors", "fs"] }
tower = { version = "0.5", features = ["util"] }
wasmtime = { version = "45", features = ["component-model", "wat"] }
anyhow = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
glob = "0.3"
tempfile = "3"
inventory = "0.3"

# Terminal
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f" }
libc = "0.2"
async-channel = "2"

# Zed crates (统一 git rev)
sum_tree = { git = "https://github.com/zed-industries/zed.git", rev = "f6838a7c4afecd7c212c43c70165588b92a5a11f" }
notify = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
notify-types = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }

# --- Workspace-internal path deps (统一管理，子 crate 用 .workspace = true) ---
aa-kernel = { path = "packages/kernel" }
aa-core = { path = "packages/core" }
aa-extension-sdk = { path = "packages/extension-sdk" }
aa-extensions = { path = "packages/extensions" }
aa-function-tools = { path = "packages/function-tools" }
aa-extension-mcp = { path = "packages/extension-mcp" }
aa-llm = { path = "packages/llm" }
aa-session = { path = "packages/session" }
aa-server = { path = "packages/server" }
sidebar = { path = "packages/sidebar" }
terminal = { path = "packages/terminal" }
terminal_view = { path = "packages/terminal_view" }
task = { path = "packages/task" }
title_bar = { path = "packages/title_bar" }
settings = { path = "packages/settings" }
settings_content = { path = "packages/settings_content" }
settings_macros = { path = "packages/settings_macros" }
theme_settings = { path = "packages/theme_settings" }
util = { path = "packages/util" }
workspace = { path = "packages/workspace" }
fs = { path = "packages/fs" }
project = { path = "packages/project" }
rope = { path = "packages/rope" }
text = { path = "packages/text" }
breadcrumbs = { path = "packages/breadcrumbs" }
language = { path = "packages/language" }
# 外部 gpui_learn 共享库（GitHub git 依赖，稳定可复现）
aa_gpui_kit_assets = { git = "https://github.com/Nahida-aa/gpui_learn.git", rev = "95c42cc7833e545f7ffd0ff77aadd4bd31da1594" }
aa_gpui_kit_theme = { git = "https://github.com/Nahida-aa/gpui_learn.git", rev = "95c42cc7833e545f7ffd0ff77aadd4bd31da1594" }
aa_gpui_kit_ui = { git = "https://github.com/Nahida-aa/gpui_learn.git", rev = "95c42cc7833e545f7ffd0ff77aadd4bd31da1594" }
editor = { git = "https://github.com/Nahida-aa/gpui_learn.git", rev = "95c42cc7833e545f7ffd0ff77aadd4bd31da1594" }

[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed", rev = "f6838a7c4afecd7c212c43c70165588b92a5a11f", version = "=0.2.2" }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "f6838a7c4afecd7c212c43c70165588b92a5a11f", version = "=0.1.0" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f6838a7c4afecd7c212c43c70165588b92a5a11f", version = "=0.1.0" }
gpui_wgpu = { git = "https://github.com/zed-industries/zed", rev = "f6838a7c4afecd7c212c43c70165588b92a5a11f", version = "=0.1.0" }
gpui_util = { git = "https://github.com/zed-industries/zed", rev = "f6838a7c4afecd7c212c43c70165588b92a5a11f", version = "=0.1.0" }
