[package]
name = "aa-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "aaBot CLI entry point"

[dependencies]
aa-kernel = { path = "../kernel" }
aa-function-tools = { path = "../function-tools" }
aa-extension-mcp = { path = "../extension-mcp" }
aa-core = { path = "../core" }
aa-llm = { path = "../llm" }
aa-config = { path = "../config" }
aa-session = { path = "../session" }
aa-server = { path = "../server" }
axum = { workspace = true, features = ["default"] }
clap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
anyhow = { workspace = true }
uuid = { workspace = true }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["osc52"] }
pulldown-cmark = "0.13"
