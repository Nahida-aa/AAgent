[package]
name = "aa-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AAgent HTTP/WS API 服务"

[dependencies]
aa-kernel.workspace = true
aa-core.workspace = true
aa-extensions.workspace = true
aa-function-tools.workspace = true
aa-extension-mcp.workspace = true
aa-llm.workspace = true
settings.workspace = true
settings-content.workspace = true
aa-session.workspace = true
axum = { workspace = true, features = ["default", "ws"] }
nix = { version = "0.29", features = ["fs", "term"] }
libc = "0.2"
tower-http = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
tracing-subscriber = "0.3"
clap = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
utoipa = { version = "5", features = ["axum_extras"] }
anyhow = { workspace = true }
mdns-sd = "0.13"
