[package]
name = "aa-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "aaBot HTTP/WS API 服务"

[dependencies]
aa-kernel = { path = "../kernel" }
aa-core = { path = "../core" }
aa-extensions = { path = "../extensions" }
aa-function-tools = { path = "../function-tools" }
aa-extension-mcp = { path = "../extension-mcp" }
aa-llm = { path = "../llm" }
aa-config = { path = "../config" }
aa-session = { path = "../session" }
axum = { workspace = true, features = ["default", "ws"] }
nix = { version = "0.29", features = ["fs", "term"] }
libc = "0.2"
tower-http = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
tracing-subscriber = "0.3"
clap = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
utoipa = { version = "5", features = ["axum_extras"] }
anyhow = { workspace = true }
mdns-sd = "0.13"
